name: Build and publish Squishy World

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: squishy-world-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and export Godot 4.7.2
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare Godot Web export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
      - name: Import project and validate GDScript
        run: |
          godot --headless --editor --path . --quit > /tmp/squishy-import.log 2>&1
          cat /tmp/squishy-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/squishy-import.log; then
            echo "GDScript validation failed"
            exit 1
          fi
      - name: Test math challenge correctness
        run: godot --headless --path . --script res://tests/math_smoke.gd
      - name: Verify Jelly Merge grade rules
        run: godot --headless --path . --script res://tests/merge_smoke.gd
      - name: Smoke-test game startup
        run: |
          godot --headless --path . --quit-after 5 > /tmp/squishy-runtime.log 2>&1
          cat /tmp/squishy-runtime.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Invalid call|Failed to load script' /tmp/squishy-runtime.log; then
            echo "Runtime validation failed"
            exit 1
          fi
      - name: Export browser game
        run: |
          mkdir -p web
          godot --headless --path . --export-release Web web/index.html
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck
      - name: Upload Pages payload
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
          retention-days: 1

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy
        id: pages
        uses: actions/deploy-pages@v4
