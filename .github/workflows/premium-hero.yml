name: Blender Premium Hero Review
on:
  push:
    branches:
      - feature/premium-3d-world
    paths:
      - tools/blender/**
      - .github/workflows/premium-hero.yml
      - scripts/premium/**
      - shaders/premium/**
      - tests/premium_spring_smoke.gd
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Blender 4.5.14
        run: |
          curl -fsSL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-4.5.14-linux-x64" >> "$GITHUB_PATH"
      - name: Generate editable Blender source, GLB and reference render
        run: |
          mkdir -p production-preview
          ASSET_OUT=production-preview blender --background --factory-startup --python tools/blender/make_hero.py | tee /tmp/art.log
          grep -q "SUCCESS: hero preview" /tmp/art.log
          test -s production-preview/hero_squishy.blend
          test -s production-preview/hero_squishy.glb
          test -s production-preview/hero_preview.png
      - name: Verify GLB morph targets and material payload
        run: python3 tools/blender/validate_glb.py production-preview/hero_squishy.glb
      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: squishy-hero-blender-review
          path: production-preview/
          retention-days: 14

  test-jelly-springs:
    name: Verify Godot spring dynamics
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import premium controller scripts
        run: |
          godot --headless --editor --path . --quit > /tmp/import.log 2>&1
          cat /tmp/import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Test 100 release and stretch cycles
        run: godot --headless --path . --script res://tests/premium_spring_smoke.gd
      - name: Test 13-point lattice overshoot, waves, 100 repeated impacts
        run: godot --headless --path . --script res://tests/premium_lattice_smoke.gd

  build-browser-lab:
    name: Export interactive 3D physics lab to WebGL2
    needs: [build-asset, test-jelly-springs]
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Load exported Blender 3D model
        uses: actions/download-artifact@v4
        with:
          name: squishy-hero-blender-review
          path: /tmp/premium-asset
      - name: Stage premium model and isolated scene
        run: |
          mkdir -p assets/premium
          cp /tmp/premium-asset/hero_squishy.glb assets/premium/hero_squishy.glb
          sed -i 's@run/main_scene="res://scenes/main.tscn"@run/main_scene="res://scenes/premium/character_lab.tscn"@' project.godot
          grep -q 'scenes/premium/character_lab.tscn' project.godot
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
      - name: Import Blender GLB and validate the Godot scene
        run: |
          godot --headless --path . --import > /tmp/lab-import.log 2>&1
          cat /tmp/lab-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR: Condition|Blender path is invalid' /tmp/lab-import.log; then exit 1; fi
      - name: Start premium physics scene headlessly
        run: |
          godot --headless --path . --quit-after 15 > /tmp/lab-runtime.log 2>&1
          cat /tmp/lab-runtime.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Invalid call|Premium hero glb missing|SquishyBody not found' /tmp/lab-runtime.log; then exit 1; fi
      - name: Export standalone character lab WebAssembly
        run: |
          mkdir -p premium-web
          godot --headless --path . --export-release Web premium-web/index.html
          test -s premium-web/index.html
          test -s premium-web/index.wasm
          test -s premium-web/index.pck
      - name: Bundle model review gallery with isolated browser lab
        run: |
          mkdir -p premium-web/reviews
          cp /tmp/premium-asset/hero_preview.png premium-web/reviews/
          cp /tmp/premium-asset/hero_front.png premium-web/reviews/
          cp /tmp/premium-asset/hero_side.png premium-web/reviews/
          cp /tmp/premium-asset/hero_back.png premium-web/reviews/
          cp tools/blender/hero_gallery.html premium-web/reviews/index.html
          test -s premium-web/reviews/hero_front.png
      - name: Upload browser testing build without publishing production
        uses: actions/upload-artifact@v4
        with:
          name: premium-3d-browser-lab
          path: premium-web/
          retention-days: 14
